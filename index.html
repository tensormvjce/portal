<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tensor Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap');
    
    :root {
      --primary: #6366f1;
      --primary-gradient: linear-gradient(120deg, #6366f1, #818cf8);
      --secondary: #10b981;
      --background: #0f172a;
      --surface: #1e293b;
      --surface-light: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border-radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --error: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --info: #3b82f6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: var(--background);
      color: var(--text);
      min-height: 100vh;
      padding: 2.5rem 2rem;
      position: relative;
      overflow-x: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.7;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      gap: 2.5rem;
      grid-template-columns: 1fr 1fr;
    }

    .card {
      background: rgba(30, 41, 59, 0.8);  
      backdrop-filter: blur(10px);
      border-radius: var(--border-radius);
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: var(--transition);
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.25);
    }

    .slot-item {
      padding: 1.25rem;
      background: rgba(51, 65, 85, 0.5);
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      transition: var(--transition);
      border-left: 4px solid var(--primary);
    } 

    .slot-item:hover {
      background: rgba(51, 65, 85, 0.8);
      transform: scale(1.02);
    }

    .form-card {
      position: sticky;
      top: 2rem;
      height: fit-content;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .title img {
      height: 55px;
      animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    .title h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.8rem;
      background: linear-gradient(120deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
      transition: var(--transition);
    }

    input, select {
      width: 100%;
      padding: 0.9rem 1rem;
      background: var(--surface-light);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: var(--text);
      transition: var(--transition);
      font-size: 0.95rem;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    button {
      width: 100%;
      padding: 1rem;
      background: var(--primary-gradient);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      font-size: 1rem;
      letter-spacing: 0.5px;
    }

    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: 0.5s;
    }

    button:hover::before {
      left: 100%;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px -3px rgba(99, 102, 241, 0.4);
    }

    .alert {
      padding: 1rem;
      background: var(--secondary);
      color: white;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: none;
      animation: slideDown 0.5s ease forwards;
      position: relative;
      overflow: hidden;
    }

    .alert::after {
      content: '';
      position: absolute;
      height: 2px;
      bottom: 0;
      left: 0;
      width: 0;
      background: white;
      animation: progress 3s linear forwards;
    }

    @keyframes slideDown {
      0% { transform: translateY(-20px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .slots-list {
      display: grid;
      gap: 1.5rem;
    }

    .slots-list h3 {
      margin-top: 1rem;
      margin-bottom: 1rem;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      position: relative;
      display: inline-block;
      padding-bottom: 0.5rem;
    }

    .slots-list h3::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 50%;
      height: 3px;
      background: var(--primary);
      border-radius: 3px;
    }

    .slot-details {
      display: grid;
      gap: 0.5rem;
      width: 100%;
    }

    .slot-day {
      font-weight: 600;
      margin-bottom: 0.25rem;
      font-size: 1.05rem;
    }

    .slot-date {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .slot-role {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.25rem;
    }

    .whatsapp-contact {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: 0.5rem;
    }

    .whatsapp-link {
      color: #25D366;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: var(--transition);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      position: relative;
    }

    .whatsapp-link:hover {
      background: rgba(37, 211, 102, 0.1);
      transform: scale(1.05);
    }

    .whatsapp-link i {
      color: #25D366;
      font-size: 1.2rem;
    }

    .whatsapp-name {
      color: var(--text);
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
    }

    .whatsapp-name:hover {
      color: #25D366;
      background: rgba(37, 211, 102, 0.1);
    }

    .no-bookings {
      text-align: center;
      color: var(--text-muted);
      padding: 1.5rem;
      background: rgba(51, 65, 85, 0.3);
      border-radius: 8px;
      margin-bottom: 1rem;
      border: 1px dashed rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    /* Countdown Banner Styles */
    .countdown-banner {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0 auto 2rem;
      max-width: 1200px;
      border-radius: var(--border-radius);
      padding: 1.5rem 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: slideDown 0.5s ease forwards;
    }

    .countdown-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2rem;
    }

    .countdown-message {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      color: white;
      font-weight: 600;
    }

    .countdown-message i {
      font-size: 1.5rem;
      animation: pulse 2s infinite;
      margin-right: 0.5rem;
    }

    .countdown-main-text {
      display: flex;
      align-items: center;
      font-size: 1.1rem;
    }

    .countdown-deadline-info {
      font-size: 0.9rem;
      opacity: 0.9;
      font-weight: 400;
    }

    .countdown-timer {
      background: rgba(255, 255, 255, 0.2);
      padding: 1rem 1.5rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      text-align: center;
    }

    .countdown-display {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .countdown-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 60px;
    }

    .countdown-number {
      color: white;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: 1px;
      line-height: 1;
    }

    .countdown-label {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 0.25rem;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
      
      .form-card {
        position: static;
      }

      body {
        padding: 1.5rem 1rem;
      }

      .countdown-content {
        flex-direction: column;
        text-align: center;
        gap: 1rem;
      }
      
      .countdown-timer {
        width: 100%;
        text-align: center;
      }

      .countdown-display {
        gap: 0.5rem;
      }

      .countdown-unit {
        min-width: 50px;
      }

      .countdown-number {
        font-size: 1.2rem;
      }

      .countdown-label {
        font-size: 0.6rem;
      }

      .countdown-main-text {
        font-size: 1rem;
      }

      .countdown-deadline-info {
        font-size: 0.8rem;
      }
    }

    .credits {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 0 1rem;
      color: rgba(177, 175, 175, 0.7);
    }

    .credits a {
      text-decoration: none;
      color: rgb(255, 255, 255);
      font-weight: 600;
      position: relative;
      padding: 0 2px;
    }

    .credits a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1px;
      background: white;
      transition: width 0.3s ease;
    }

    .toast-container {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .toast {
      padding: 1rem 1.5rem;
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      transform: translateX(120%);
      opacity: 0;
      animation: slideIn 0.3s ease forwards;
    }

    @keyframes slideIn {
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    button.loading::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid transparent;
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <canvas></canvas>
  
  <div id="mainPortal">
    <!-- Countdown Banner -->
    <div id="countdownBanner" class="countdown-banner" style="display: none;">
      <div class="countdown-content">
        <div class="countdown-message">
          <div class="countdown-main-text">
            <i class="fas fa-clock"></i>
            <span id="countdownText">⏰ Time's ticking! Book your slots before the deadline!</span>
          </div>
          <div class="countdown-deadline-info" id="deadlineInfo">
            Deadline: Friday, 11:59 PM
          </div>
        </div>
        <div class="countdown-timer">
          <div class="countdown-display" id="countdownDisplay">
            <div class="countdown-unit">
              <div class="countdown-number" id="days">--</div>
              <div class="countdown-label">Days</div>
            </div>
            <div class="countdown-unit">
              <div class="countdown-number" id="hours">--</div>
              <div class="countdown-label">Hours</div>
            </div>
            <div class="countdown-unit">
              <div class="countdown-number" id="minutes">--</div>
              <div class="countdown-label">Minutes</div>
            </div>
            <div class="countdown-unit">
              <div class="countdown-number" id="seconds">--</div>
              <div class="countdown-label">Seconds</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="container">
      <div class="card form-card">
        <div class="title">
          <img src="logo_white.png" alt="Tensor Logo">
          <h1>Weekly Post Slots</h1>
        </div>

        <div class="alert" id="successAlert">
          <i class="fas fa-check-circle"></i> Slot booked successfully!
        </div>

        <form id="slotBookingForm">
          <div class="form-group">
            <label for="userName">Full Name</label>
            <input type="text" id="userName" placeholder="Enter your full name" autocomplete="name" required>
          </div>

          <div class="form-group">
            <label for="dateRangeSelect">Date Range</label>
            <select id="dateRangeSelect" required>
              <option value="" disabled selected>Select week</option>
            </select>
          </div>

          <div class="form-group">
            <label for="daySelect">Preferred Day</label>
            <select id="daySelect" required>
              <option value="" disabled selected>Choose day</option>
            </select>
          </div>

          <div class="form-group">
            <label for="number">WhatsApp Number</label>
            <input type="tel" id="number" placeholder="Include country code (e.g. +91 1234567890)" autocomplete="tel" required>
          </div>

          <div class="form-group">
            <label for="roleSelect">Post Type</label>
            <select id="roleSelect" required>
              <option value="" disabled selected>Select role</option>
            </select>
          </div>

          <button type="submit">
            <span>Book Slot</span>
            <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
          </button>
        </form>
      </div>

      <div class="card">
        <h2 style="text-align: center; margin-bottom: 2rem; font-family: 'Montserrat', sans-serif;">Current Bookings</h2>
        <div class="slots-list" id="slotAvailability">
          <div class="no-bookings">
            <i class="fas fa-calendar-alt" style="font-size: 2rem; margin-bottom: 0.5rem;"></i>
            <div>Loading bookings...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div class="credits">
    <footer>
      <p>Designed and developed by: <a href="https://www.linkedin.com/in/srikar-t-118581286/">Srikar</a> & <a href="https://www.linkedin.com/in/piratla-ankit-rama-datt/">Ankit</a></p>
    </footer>
  </div>

  <div class="toast-container"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import { getDatabase, ref, get, set, push } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
    
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyB-PZMH9kvSziZepwpL2994IV9OZD5Uj-k",
      authDomain: "tensor-portal.firebaseapp.com",
      projectId: "tensor-portal",
      storageBucket: "tensor-portal.appspot.com",
      messagingSenderId: "860387540675",
      appId: "1:860387540675:web:44acbeddd76e6c2e706c76",
      measurementId: "G-P23J5L5DEX"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // Global variables
    let dateRanges = {};
    let countdownInterval = null;

    // Generate proper week ranges with booking logic
    function generateWeekRanges() {
      const now = new Date();
      const ranges = {};
      
      // Get current week start (Monday)
      const currentWeekStart = new Date(now);
      currentWeekStart.setDate(now.getDate() - now.getDay() + 1);
      
      // Generate current week and next week
      for (let i = 0; i < 2; i++) {
        const weekStart = new Date(currentWeekStart);
        weekStart.setDate(currentWeekStart.getDate() + (i * 7));
        
        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekStart.getDate() + 6);
        
        // Format week key
        const startMonth = weekStart.toLocaleDateString('en-US', { month: 'short' });
        const endMonth = weekEnd.toLocaleDateString('en-US', { month: 'short' });
        const weekKey = `${startMonth}${weekStart.getDate()}-${endMonth}${weekEnd.getDate()}`;
        
        // Find Wednesday and Sunday
        const wednesday = new Date(weekStart);
        while (wednesday.getDay() !== 3) {
          wednesday.setDate(wednesday.getDate() + 1);
        }
        
        const sunday = new Date(weekStart);
        while (sunday.getDay() !== 0) {
          sunday.setDate(sunday.getDate() + 1);
        }
        
        ranges[weekKey] = {
          start: weekStart,
          end: weekEnd,
          days: {
            'Wednesday': wednesday,
            'Sunday': {
              date: sunday,
              postType: i % 2 === 0 ? 'text' : 'video'
            }
          },
          isCurrent: i === 0,
          isNext: i === 1
        };
      }
      
      return ranges;
    }

    // Get booking status and available weeks
    function getBookingStatus() {
      const now = new Date();
      const currentDay = now.getDay(); // 0 = Sunday, 1 = Monday, etc.
      const currentHour = now.getHours();
      
      // Get current week start (Monday)
      const currentWeekStart = new Date(now);
      currentWeekStart.setDate(now.getDate() - now.getDay() + 1);
      
      // Get next week start
      const nextWeekStart = new Date(currentWeekStart);
      nextWeekStart.setDate(currentWeekStart.getDate() + 7);
      
      // Booking deadline is Sunday 7 PM for next week
      const bookingDeadline = new Date(currentWeekStart);
      bookingDeadline.setDate(bookingDeadline.getDate() + 6); // Sunday of current week
      bookingDeadline.setHours(19, 0, 0, 0); // 7 PM
      
      // Check if booking is still open
      const isBookingOpen = now < bookingDeadline;
      
      // Determine which week users can book for
      let bookableWeek = null;
      if (isBookingOpen) {
        // Can book for next week
        const nextWeekEnd = new Date(nextWeekStart);
        nextWeekEnd.setDate(nextWeekStart.getDate() + 6);
        
        const startMonth = nextWeekStart.toLocaleDateString('en-US', { month: 'short' });
        const endMonth = nextWeekEnd.toLocaleDateString('en-US', { month: 'short' });
        bookableWeek = `${startMonth}${nextWeekStart.getDate()}-${endMonth}${nextWeekEnd.getDate()}`;
      }
      
      return {
        isBookingOpen,
        bookingDeadline,
        bookableWeek,
        currentWeekStart,
        nextWeekStart
      };
    }

    // Start countdown to booking deadline
    function startCountdown() {
      const countdownBanner = document.getElementById('countdownBanner');
      const countdownText = document.getElementById('countdownText');
      const deadlineInfo = document.getElementById('deadlineInfo');
      const daysElement = document.getElementById('days');
      const hoursElement = document.getElementById('hours');
      const minutesElement = document.getElementById('minutes');
      const secondsElement = document.getElementById('seconds');
      
      if (!countdownBanner || !daysElement) return;
      
      const bookingStatus = getBookingStatus();
      
      if (!bookingStatus.isBookingOpen) {
        // Booking is closed, hide countdown
        countdownBanner.style.display = 'none';
        return;
      }
      
      // Show countdown banner
      countdownBanner.style.display = 'block';
      
      const deadline = bookingStatus.bookingDeadline;
      
      // Format deadline info
      const deadlineFormatted = deadline.toLocaleDateString('en-US', { 
        weekday: 'long', 
        month: 'long', 
        day: 'numeric',
        year: 'numeric'
      });
      const deadlineTime = deadline.toLocaleTimeString('en-US', { 
        hour: 'numeric', 
        minute: '2-digit',
        hour12: true 
      });
      
      if (deadlineInfo) {
        deadlineInfo.textContent = `Booking deadline: ${deadlineFormatted} at ${deadlineTime}`;
      }
      
      // Update countdown every second
      const updateCountdown = () => {
        const now = new Date();
        const timeLeft = deadline - now;
        
        if (timeLeft <= 0) {
          daysElement.textContent = '00';
          hoursElement.textContent = '00';
          minutesElement.textContent = '00';
          secondsElement.textContent = '00';
          countdownText.textContent = '⏰ Booking deadline has passed!';
          if (deadlineInfo) {
            deadlineInfo.textContent = 'Booking period has ended - slots will be auto-assigned';
          }
          
          // Hide the form since booking is closed
          const form = document.getElementById('slotBookingForm');
          if (form) {
            form.style.display = 'none';
          }
          
          // Show message about auto-assignment
          const formCard = document.querySelector('.form-card');
          if (formCard && !document.getElementById('bookingClosedMessage')) {
            const closedMessage = document.createElement('div');
            closedMessage.id = 'bookingClosedMessage';
            closedMessage.style.cssText = `
              text-align: center;
              padding: 2rem;
              background: rgba(239, 68, 68, 0.1);
              border: 1px solid rgba(239, 68, 68, 0.3);
              border-radius: 8px;
              color: var(--text);
            `;
            closedMessage.innerHTML = `
              <i class="fas fa-clock" style="font-size: 2rem; color: #ef4444; margin-bottom: 1rem;"></i>
              <h3 style="margin-bottom: 0.5rem;">Booking Period Closed</h3>
              <p style="color: var(--text-muted);">Slots for next week will be automatically assigned.</p>
            `;
            formCard.appendChild(closedMessage);
          }
          
          return;
        }
        
        const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
        const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
        
        daysElement.textContent = days.toString().padStart(2, '0');
        hoursElement.textContent = hours.toString().padStart(2, '0');
        minutesElement.textContent = minutes.toString().padStart(2, '0');
        secondsElement.textContent = seconds.toString().padStart(2, '0');
        
        // Dynamic message based on time left
        const bookableWeek = bookingStatus.bookableWeek;
        if (days > 1) {
          countdownText.textContent = `⏰ ${days} days left to book for week ${bookableWeek}!`;
        } else if (days === 1) {
          countdownText.textContent = `⏰ Last day to book for ${bookableWeek}! Only ${hours} hours remaining!`;
        } else if (hours > 1) {
          countdownText.textContent = `⏰ Hurry! Only ${hours} hours left to book for ${bookableWeek}!`;
        } else {
          countdownText.textContent = `⏰ Final minutes to book for ${bookableWeek}!`;
        }
      };
      
      // Clear existing interval
      if (countdownInterval) {
        clearInterval(countdownInterval);
      }
      
      // Start new countdown
      updateCountdown();
      countdownInterval = setInterval(updateCountdown, 1000);
    }

    // Update dropdowns based on booking status
    function updateDropdowns() {
      const dateRangeSelect = document.getElementById('dateRangeSelect');
      const daySelect = document.getElementById('daySelect');
      const roleSelect = document.getElementById('roleSelect');
      const form = document.getElementById('slotBookingForm');
      
      if (!dateRangeSelect) return;
      
      const bookingStatus = getBookingStatus();
      
      // Clear dropdown
      dateRangeSelect.innerHTML = '<option value="" disabled selected>Select week</option>';
      
      if (bookingStatus.isBookingOpen && bookingStatus.bookableWeek) {
        // Booking is open - show only the bookable week
        const option = document.createElement('option');
        option.value = bookingStatus.bookableWeek;
        option.textContent = `${bookingStatus.bookableWeek.replace('-', ' - ')}, ${new Date().getFullYear()}`;
        dateRangeSelect.appendChild(option);
        
        // Enable form
        if (form) {
          form.style.display = 'block';
        }
        
        // Auto-select the bookable week
        dateRangeSelect.value = bookingStatus.bookableWeek;
        updateDayDropdown(bookingStatus.bookableWeek);
        
      } else {
        // Booking is closed
        const option = document.createElement('option');
        option.value = '';
        option.textContent = 'Booking period closed - Auto-assignment in progress';
        option.disabled = true;
        dateRangeSelect.appendChild(option);
        
        // Disable form
        if (form) {
          form.style.display = 'none';
        }
      }
      
      // Add event listener for date range change
      dateRangeSelect.addEventListener('change', function() {
        const selectedWeek = this.value;
        if (!selectedWeek) return;
        updateDayDropdown(selectedWeek);
      });
      
      // Add event listener for day change
      if (daySelect) {
        daySelect.addEventListener('change', function() {
          const selectedDay = this.value;
          updateRoleDropdown(selectedDay);
        });
      }
    }

    // Update day dropdown for selected week
    function updateDayDropdown(weekKey) {
      const daySelect = document.getElementById('daySelect');
      if (!daySelect || !dateRanges[weekKey]) return;
      
      daySelect.innerHTML = '<option value="" disabled selected>Choose day</option>';
      
      const wednesdayOption = document.createElement('option');
      wednesdayOption.value = 'Wednesday';
      wednesdayOption.textContent = 'Wednesday (Blog Post)';
      daySelect.appendChild(wednesdayOption);
      
      const sundayOption = document.createElement('option');
      sundayOption.value = 'Sunday';
      const postType = dateRanges[weekKey].days.Sunday.postType;
      sundayOption.textContent = `Sunday (${postType.charAt(0).toUpperCase() + postType.slice(1)} Post)`;
      daySelect.appendChild(sundayOption);
    }

    // Update role dropdown for selected day
    function updateRoleDropdown(selectedDay) {
      const roleSelect = document.getElementById('roleSelect');
      if (!roleSelect || !selectedDay) return;
      
      roleSelect.innerHTML = '<option value="" disabled selected>Select role</option>';
      
      if (selectedDay === 'Wednesday') {
        const blogOption = document.createElement('option');
        blogOption.value = 'BlogPost';
        blogOption.textContent = 'Blog Post Writer';
        roleSelect.appendChild(blogOption);
      } else if (selectedDay === 'Sunday') {
        const contentOption = document.createElement('option');
        contentOption.value = 'Content';
        contentOption.textContent = 'Content Creator';
        roleSelect.appendChild(contentOption);
        
        const designOption = document.createElement('option');
        designOption.value = 'Design';
        designOption.textContent = 'Designer';
        roleSelect.appendChild(designOption);
      }
    }

    // Show toast notification
    function showToast(message, type = 'info') {
      const toastContainer = document.querySelector('.toast-container');
      if (!toastContainer) return;
      
      const toast = document.createElement('div');
      toast.className = 'toast';
      
      const icon = type === 'success' ? 'check-circle' : 
                   type === 'error' ? 'exclamation-circle' : 
                   type === 'warning' ? 'exclamation-triangle' : 'info-circle';
      
      toast.innerHTML = `
        <i class="fas fa-${icon}"></i>
        <span>${message}</span>
      `;
      
      toastContainer.appendChild(toast);
      
      // Remove toast after 5 seconds
      setTimeout(() => {
        toast.remove();
      }, 5000);
    }

    // Load slot availability
    async function loadSlotAvailability() {
      const slotAvailability = document.getElementById('slotAvailability');
      if (!slotAvailability) return;
      
      try {
        let slotsHTML = '';
        const bookingStatus = getBookingStatus();
        
        // Show current week and next week bookings
        for (const [weekKey, weekData] of Object.entries(dateRanges)) {
          // Add week status indicator
          let weekStatus = '';
          if (weekData.isCurrent) {
            weekStatus = ' (Current Week)';
          } else if (weekData.isNext && bookingStatus.isBookingOpen) {
            weekStatus = ' (Booking Open)';
          } else if (weekData.isNext && !bookingStatus.isBookingOpen) {
            weekStatus = ' (Auto-Assignment)';
          }
          
          slotsHTML += `<h3>${weekKey.replace('-', ' - ')}${weekStatus}</h3>`;
          const bookingsRef = ref(db, `bookings/${weekKey}`);
          const bookingsSnapshot = await get(bookingsRef);
          const bookings = bookingsSnapshot.exists() ? bookingsSnapshot.val() : {};
          
          slotsHTML += `<h3>${weekKey.replace('-', ' - ')}</h3>`;
          
          // Wednesday slots
          const wednesdayBookings = bookings.Wednesday || {};
          const blogBookings = wednesdayBookings.BlogPost || {};
          
          if (Object.keys(blogBookings).length > 0) {
            Object.values(blogBookings).forEach(booking => {
              slotsHTML += `
                <div class="slot-item">
                  <div class="slot-details">
                    <div class="slot-day">Wednesday</div>
                    <div class="slot-date">${weekData.days.Wednesday.toLocaleDateString()}</div>
                    <div class="slot-role">
                      <span>Blog Post:</span>
                      <div class="whatsapp-contact">
                        <a href="https://wa.me/${booking.number.replace(/\D/g, '')}" class="whatsapp-link" target="_blank" title="Contact ${booking.name} on WhatsApp">
                          <i class="fab fa-whatsapp"></i>
                        </a>
                        <a href="https://wa.me/${booking.number.replace(/\D/g, '')}" class="whatsapp-name" target="_blank" title="Contact ${booking.name} on WhatsApp">
                          ${booking.name}
                        </a>
                      </div>
                    </div>
                  </div>
                </div>
              `;
            });
          } else {
            slotsHTML += `
              <div class="no-bookings">
                <i class="fas fa-calendar-plus"></i>
                <div>No blog post assignments for Wednesday</div>
              </div>
            `;
          }
          
          // Sunday slots
          const sundayBookings = bookings.Sunday || {};
          const contentBookings = sundayBookings.Content || {};
          const designBookings = sundayBookings.Design || {};
          
          if (Object.keys(contentBookings).length > 0 || Object.keys(designBookings).length > 0) {
            Object.values(contentBookings).forEach(booking => {
              const postType = weekData.days.Sunday.postType;
              slotsHTML += `
                <div class="slot-item">
                  <div class="slot-details">
                    <div class="slot-day">Sunday</div>
                    <div class="slot-date">${weekData.days.Sunday.date.toLocaleDateString()}</div>
                    <div class="slot-role">
                      <span>Content (${postType}):</span>
                      <div class="whatsapp-contact">
                        <a href="https://wa.me/${booking.number.replace(/\D/g, '')}" class="whatsapp-link" target="_blank" title="Contact ${booking.name} on WhatsApp">
                          <i class="fab fa-whatsapp"></i>
                        </a>
                        <a href="https://wa.me/${booking.number.replace(/\D/g, '')}" class="whatsapp-name" target="_blank" title="Contact ${booking.name} on WhatsApp">
                          ${booking.name}
                        </a>
                      </div>
                    </div>
                  </div>
                </div>
              `;
            });
            
            Object.values(designBookings).forEach(booking => {
              const postType = weekData.days.Sunday.postType;
              slotsHTML += `
                <div class="slot-item">
                  <div class="slot-details">
                    <div class="slot-day">Sunday</div>
                    <div class="slot-date">${weekData.days.Sunday.date.toLocaleDateString()}</div>
                    <div class="slot-role">
                      <span>Design (${postType}):</span>
                      <div class="whatsapp-contact">
                        <a href="https://wa.me/${booking.number.replace(/\D/g, '')}" class="whatsapp-link" target="_blank" title="Contact ${booking.name} on WhatsApp">
                          <i class="fab fa-whatsapp"></i>
                        </a>
                        <a href="https://wa.me/${booking.number.replace(/\D/g, '')}" class="whatsapp-name" target="_blank" title="Contact ${booking.name} on WhatsApp">
                          ${booking.name}
                        </a>
                      </div>
                    </div>
                  </div>
                </div>
              `;
            });
          } else {
            slotsHTML += `
              <div class="no-bookings">
                <i class="fas fa-calendar-plus"></i>
                <div>No Sunday assignments yet</div>
              </div>
            `;
          }
        }
        
        slotAvailability.innerHTML = slotsHTML;
        
      } catch (error) {
        console.error('Error loading slot availability:', error);
        slotAvailability.innerHTML = `
          <div class="no-bookings">
            <i class="fas fa-exclamation-triangle"></i>
            <div>Error loading bookings</div>
          </div>
        `;
      }
    }

    // Handle form submission
    document.getElementById('slotBookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const successAlert = document.getElementById('successAlert');
      
      try {
        // Get form data
        const formData = new FormData(e.target);
        const userName = formData.get('userName') || document.getElementById('userName').value;
        const dateRange = formData.get('dateRange') || document.getElementById('dateRangeSelect').value;
        const day = formData.get('day') || document.getElementById('daySelect').value;
        const role = formData.get('role') || document.getElementById('roleSelect').value;
        const number = formData.get('number') || document.getElementById('number').value;
        
        if (!userName || !dateRange || !day || !role || !number) {
          showToast('Please fill in all required fields', 'warning');
          return;
        }
        
        // Show loading state
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;
        
        // Create booking data
        const bookingData = {
          name: userName,
          number: number,
          timestamp: new Date().toISOString()
        };
        
        // Save to Firebase
        const bookingRef = ref(db, `bookings/${dateRange}/${day}/${role}`);
        const newBookingRef = push(bookingRef);
        await set(newBookingRef, bookingData);
        
        // Show success message
        successAlert.style.display = 'block';
        showToast('Slot booked successfully!', 'success');
        
        // Reset form
        e.target.reset();
        
        // Reload slot availability
        await loadSlotAvailability();
        
        // Hide success alert after 3 seconds
        setTimeout(() => {
          successAlert.style.display = 'none';
        }, 3000);
        
      } catch (error) {
        console.error('Error booking slot:', error);
        showToast('Error booking slot. Please try again.', 'error');
      } finally {
        // Remove loading state
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
      }
    });

    // Initialize the system
    async function initializeSystem() {
      console.log('Initializing system...');
      
      // Generate week ranges with proper booking logic
      dateRanges = generateWeekRanges();
      console.log('Generated week ranges:', dateRanges);
      
      // Get booking status
      const bookingStatus = getBookingStatus();
      console.log('Booking status:', bookingStatus);
      
      // Update dropdowns based on booking status
      updateDropdowns();
      
      // Start countdown if booking is open
      if (bookingStatus.isBookingOpen) {
        startCountdown();
      }
      
      // Load slot availability for both weeks
      await loadSlotAvailability();
      
      console.log('System initialized successfully');
    }

    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeSystem);
    } else {
      initializeSystem();
    }

    // Background animation
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    const particles = [];
    
    for (let i = 0; i < 50; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5,
        size: Math.random() * 2 + 1
      });
    }
    
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      particles.forEach(particle => {
        particle.x += particle.vx;
        particle.y += particle.vy;
        
        if (particle.x < 0 || particle.x > canvas.width) particle.vx *= -1;
        if (particle.y < 0 || particle.y > canvas.height) particle.vy *= -1;
        
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(99, 102, 241, 0.1)';
        ctx.fill();
      });
      
      requestAnimationFrame(animate);
    }
    
    animate();
  </script>
</body>
